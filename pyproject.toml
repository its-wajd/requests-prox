[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requests-prox"
version = "0.1.0"
description = "Proxy-aware drop-in wrapper around requests with rotation and session support."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wajd Dev" }]
keywords = ["requests", "http", "proxy", "rotation", "networking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.31.0"]

[project.urls]
Homepage = "https://github.com/its-wajd/requests-prox"
Repository = "https://github.com/its-wajd/requests-prox"
Issues = "https://github.com/its-wajd/requests-prox/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["requestspro*"]
